name: secret-scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the MIT-licensed CLI so organization ownership needs no Action license.
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          echo "$scan_dir" >> "$GITHUB_PATH"
      - name: Scan for secrets
        run: gitleaks git --redact --log-opts="--all" .
