name: secret-scan

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON array or plain label'
        type: string
        default: "ubuntu-latest"

jobs:
  gitleaks:
    runs-on: ${{ fromJSON(startsWith(inputs['runs-on'], '[') && inputs['runs-on'] || format('["{0}"]', inputs['runs-on'])) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
